{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <h2 class="mb-4">Purchase History</h2>
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title">Delivered Orders</h5>
            <table class="table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    {% for order in orders %}
                    <tr>
                        <td>#{{ order.id }}</td>
                        <td>{{ order.created_at|date:"Y-m-d" }}</td>
                        <td><span class="badge bg-success">Delivered</span></td>
                        <td>₹{{ order.total_price }}</td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="text-center">No purchase history yet.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock content %}
